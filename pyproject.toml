[project]
name = "orly"
version = "0.3.0"
description = "Command line client for O'Reilly Answers, with real book citations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "cryptography>=42",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
orly = "orly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orly"]

[dependency-groups]
dev = ["pytest>=8"]
